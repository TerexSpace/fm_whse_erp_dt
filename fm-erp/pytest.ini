[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=fm_erp
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85
    --durations=10
    --maxfail=3
    -ra
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    system: System tests (end-to-end workflows)
    slow: Slow tests (>5 seconds)
    blockchain: Requires blockchain network
    federated: Requires multiple FL clients
